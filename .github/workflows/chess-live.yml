name: Chess live mode

# Start this before you play. For the chosen number of minutes the bot checks chess.com
# every ~30 seconds and sends the analysis of each finished game to Telegram.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Longest time to stay live (max 330)"
        default: "180"
      idle:
        description: "Stop after this many minutes without a new game (0 = never)"
        default: "0"
      quiet:
        description: "true = no start/stop messages in Telegram"
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: chess-bot              # same group as the scheduled workflow, so they never run at the same time
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      CHESSCOM_USERNAME: ${{ secrets.CHESSCOM_USERNAME }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STOCKFISH_PATH: /usr/games/stockfish
      TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Madrid' }}
      WEEKLY_DIGEST_DAY: sun
      WEEKLY_DIGEST_HOUR: "18"
      DATA_DIR: data
      WATCH_POLL_SECONDS: "30"
    steps:
      # Always the newest main (default is the commit from when the run was queued, which has stale state)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Stockfish and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          pip install -r requirements.txt

      - name: Live mode
        id: live
        run: python bot.py --watch ${{ github.event.inputs.minutes || '180' }} --idle ${{ github.event.inputs.idle || '0' }} ${{ github.event.inputs.quiet == 'true' && '--quiet' || '' }}

      - name: Save state
        if: always()
        run: |
          git config user.name "chess-bot"
          git config user.email "chess-bot@users.noreply.github.com"
          git add data/state.json || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Update state"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -X theirs -q && git push -q && break
              git rebase --abort 2>/dev/null || true
              sleep $((i * 3))
            done
          fi

      # New bot code was pushed while this session was running: start a fresh session on the new code.
      - name: Restart on newer code
        if: always() && steps.live.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run chess-live.yml --repo ${{ github.repository }} -f minutes=330 -f idle=120 -f quiet=true

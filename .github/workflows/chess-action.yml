name: Chess action

# Started by the Cloudflare chat worker when you press a menu button or send a /command in Telegram.
on:
  workflow_dispatch:
    inputs:
      update:
        description: "Telegram update (JSON)"
        required: true

permissions:
  contents: write

concurrency:
  group: chess-action
  cancel-in-progress: false

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHESSCOM_USERNAME: ${{ secrets.CHESSCOM_USERNAME }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STOCKFISH_PATH: /usr/games/stockfish
      TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Madrid' }}
      DATA_DIR: data
      UPDATE_JSON: ${{ github.event.inputs.update }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Stockfish and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq stockfish
          pip install -r requirements.txt
      - name: Handle the update
        run: python bot.py --update "$UPDATE_JSON"
      - name: Save state
        if: always()
        run: |
          git config user.name "chess-bot"
          git config user.email "chess-bot@users.noreply.github.com"
          git add data/state.json || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Update state"
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash -X theirs -q && git push -q && break
              git rebase --abort 2>/dev/null || true
              sleep $((i * 3))
            done
          fi
